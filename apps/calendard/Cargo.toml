[package]
name = "nyx-calendard"
version = "0.1.1"
description = "Calendar reminders and the agenda for Glimpse, in the background"
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "nyx-calendard"
path = "src/main.rs"

[dependencies]
toml = "1.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
gio = "0.22"
glib = "0.22"
nyx-calendar-core = { path = "../../crates/nyx-calendar-core" }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "394ddf8193797cd1f420fac98b097d04fa75f0e2", default-features = false }
nyx-eds = { package = "nyx-pim", git = "https://github.com/design-nexus/nyx-core.git", rev = "a801c59bf6868d45f4120a7b4974f1c47e5fe7a1" }
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
gio = "0.22"
glib = "0.22"
nyx-eds = { package = "nyx-pim", git = "https://github.com/design-nexus/nyx-core.git", rev = "a801c59bf6868d45f4120a7b4974f1c47e5fe7a1" }
